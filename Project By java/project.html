<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let userOneValue = prompt("user input data one")
        let userTwovalue = prompt("user input data two")
        userOneValue = parseInt(userOneValue)
        userTwovalue = parseInt(userTwovalue)

        const result = userOneValue + userTwovalue
        const result2 = userOneValue - userTwovalue
        const result3 = userOneValue * userTwovalue
        const result4 = userOneValue / userTwovalue
        const result5 = userOneValue % userTwovalue

        document.write("Output:-" + result + "<br>")
        document.write("Output two:-" + result2 + "<br>")
        document.write("Output three:-" + result3 + "<br>")
        document.write("Output four:-" + result4 + "<br>")
        document.write("Output five:-" + result5) 
    </script>

</body>

</html>
