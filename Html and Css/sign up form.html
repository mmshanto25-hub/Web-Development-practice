<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUP</title>
</head>
<body>
    <fieldset>
        <legend>Signup by few step</legend>
<h1 style="color: rgb(28, 8, 65); text-align: center; background-color: rgb(27, 247, 255);">Signup Form</h1><hr>
<br>
<label for="">Your Name:-</label>
<input type="" placeholder="Enter Your name">
<br>
<label for="">Father's Name:-</label>
<input type="" placeholder="Enter Father Name">
<br>
<label for="">Mother's Name:-</label>
<input type="" placeholder="Enter mother name">
<br>
<label for="">Email:-</label>
<input type="" placeholder="Enter your e-mail">
<br>
<label for="">Phone Number</label>
<select name="" id="">
    <option value="">+880</option>
    <option value="">+110</option>
    <option value="">+990</option>
</select>
<input type="" placeholder="Enter your Phone number">
<br>
<label for="date">date of birth</label>
<input type="date">
<br>
<label for="time">Time</label>
<input type="time">
<br>
<label for="">Nationality:-</label>
<input list="a">
<datalist id="a">
    <option value="Bangladesh"></option>
    <option value="India"></option>
    <option value="Pakistan"></option>
    <option value="Canada"></option>
    <option value="Maldip"></option>
</datalist>
<br>
Gender:-
<input type="radio" id="gnd1" name="a">
<label for="gnd1">Male</label>
<input type="radio" id="gnd2" name="a">
<label for="gnd2">Female</label>
<br>
<label for="color">Color:-</label>
<input type="color">
<br>
<label for="file">choose pic</label>
<input type="file">
<br>
<input type="checkbox">
<label for="">I have a Bike</label>
<input type="checkbox">
<label for="">I have a bycicle</label>
<br>
<textarea name="">Comment</textarea>
<br>
<input type="submit" value="Send">
<input type="reset" value="Reset">
    </fieldset>
</body>
</html>
