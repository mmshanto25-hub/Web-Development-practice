<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbox</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .chat-container {
      width: min(600px, 90%);
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    .chat-header {
      padding: 20px;
      background: linear-gradient(135deg, #4f76d7, #6c9efe);
      color: white;
      text-align: center;
    }
    .chat-header h1 {
      margin: 0;
      font-size: 1.4rem;
    }
    .messages {
      max-height: 420px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #eef2fb;
    }
    .message {
      max-width: 80%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.5;
    }
    .message.user {
      align-self: flex-end;
      background: #4f76d7;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #dde2f4;
      background: white;
    }
    .chat-input input {
      flex: 1;
      border: none;
      padding: 16px 18px;
      font-size: 1rem;
      outline: none;
      background: transparent;
    }
    .chat-input button {
      border: none;
      background: #4f76d7;
      color: white;
      padding: 16px 24px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }
    .chat-input button:hover {
      background: #3d5cc6;
    }
    @media (max-width: 480px) {
      .chat-container {
        border-radius: 0;
      }
      .chat-header h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>Simple Chatbox</h1>
    </div>
    <div class="messages" id="messages">
      <div class="message bot">Hello! Type a message and press Send.</div>
    </div>
    <div class="chat-input">
      <input id="inputMessage" type="text" placeholder="Type your message..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const inputMessage = document.getElementById('inputMessage');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, type) {
      const message = document.createElement('div');
      message.classList.add('message', type);
      message.textContent = text;
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
    }

    function botResponse(text) {
      const lower = text.toLowerCase();
      if (!text.trim()) {
        return 'Please type something so I can reply.';
      }
      if (lower.includes('hello') || lower.includes('hi')) {
        return 'Hi there! How can I help you today?';
      }
      if (lower.includes('how are you')) {
        return 'I am just a chatbox, but I am doing great!';
      }
      if (lower.includes('time')) {
        return `The current time is ${new Date().toLocaleTimeString()}.`;
      }
      if (lower.includes('your name')) {
        return 'I am a simple chatbox page.';
      }
      return 'Thanks for your message! This is a demo response.';
    }

    function sendMessage() {
      const text = inputMessage.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      inputMessage.value = '';
      setTimeout(() => {
        addMessage(botResponse(text), 'bot');
      }, 300);
    }

    sendBtn.addEventListener('click', sendMessage);
    inputMessage.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
