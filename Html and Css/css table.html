<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css table.css">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <td>Elon Musk</td>
        </tr>

            <th rowspan="2">Telephone</th>

        </tr>
        <tr>
            <td>+1-555-5678</td>
    </table>
    <br>
    <table>
        <tr>
            <th>Name</th>
            <th colspan="3">Number</th>
        </tr>
        <tr>
            <td>Elon Musk</td>
            <td>+1-555-1234</td>
            <td>+1-555-5678</td>
            <td>+1-555-9012</td>
        </tr>
    </table>
</body>
</html>
